<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Patient guides · دليل المريض</title>
<style>
:root{
  --ground:#EEF3F2; --paper:#FFFFFF; --ink:#14262E; --ink2:#46585E; --line:#D3DEDC;
  --accent:#0F6E6A; --accent-soft:#E0EFEC; --caution:#9A5B12; --caution-soft:#FBF1E3;
  --flag:#A8322A; --flag-soft:#FBE9E7; --focus:#1C8C86;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --arabic:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0D1618; --paper:#142125; --ink:#E3ECEA; --ink2:#A2B3B2; --line:#2A3A3E;
    --accent:#5CC0B6; --accent-soft:#17312F; --caution:#E0A55A; --caution-soft:#2E2417;
    --flag:#F08A7F; --flag-soft:#351C1A; --focus:#6FD3C8;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0D1618; --paper:#142125; --ink:#E3ECEA; --ink2:#A2B3B2; --line:#2A3A3E;
  --accent:#5CC0B6; --accent-soft:#17312F; --caution:#E0A55A; --caution-soft:#2E2417;
  --flag:#F08A7F; --flag-soft:#351C1A; --focus:#6FD3C8;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;flex-direction:column;margin-inline-end:auto;min-width:0}
.brand b{font-family:var(--serif);font-weight:600;font-size:18px;letter-spacing:-.01em}
.brand span{font-size:12.5px;color:var(--ink2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 12px;cursor:pointer;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--paper)}
.seg button.ar{font-family:var(--arabic)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13.5px}
.ghost[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}

.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;max-width:1280px;margin:0 auto;padding-block:20px;padding-inline:16px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;max-height:calc(100vh - 96px);overflow:auto;padding-inline-end:4px}
.search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);margin-bottom:12px}
.grp{margin-bottom:14px}
.grp h4{margin:0 0 4px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:600;display:flex;justify-content:space-between}
.grp h4 small{font-family:var(--arabic);letter-spacing:0;text-transform:none;font-size:12px}
.item{display:block;width:100%;text-align:start;background:transparent;border:0;border-radius:6px;padding:6px 8px;cursor:pointer;line-height:1.3}
.item:hover{background:var(--accent-soft)}
.item[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.item .a{display:block;font-family:var(--arabic);font-size:12.5px;color:var(--ink2);font-weight:400;direction:rtl;text-align:end}
.mobilepick{display:none}

.stage{min-width:0}
.pair{display:grid;gap:20px}
.pair.both{grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}

.brochure{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:28px 30px 24px}
.brochure[lang="ar"]{font-family:var(--arabic);font-size:15.5px;line-height:1.75}
.bhead{border-bottom:2px solid var(--accent);padding-bottom:14px;margin-bottom:14px}
.bkicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
[lang="ar"] .bkicker{letter-spacing:0;font-size:13px}
.btitle{font-family:var(--serif);font-size:27px;line-height:1.2;margin:6px 0 4px;font-weight:600;text-wrap:balance;letter-spacing:-.01em}
[lang="ar"] .btitle{font-family:var(--arabic);font-weight:700;font-size:25px;line-height:1.45}
.bcond{color:var(--ink2);font-size:15px}
.glance{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:0 0 18px}
.glance div{background:var(--accent-soft);padding:8px 12px}
.glance dt{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
[lang="ar"] .glance dt{text-transform:none;letter-spacing:0;font-size:12.5px}
.glance dd{margin:2px 0 0;font-weight:600;font-size:14px;line-height:1.35}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:4px 26px}
.bsec{margin-bottom:14px}
.bsec h3{font-family:var(--serif);font-size:17px;margin:0 0 6px;font-weight:600;color:var(--ink)}
[lang="ar"] .bsec h3{font-family:var(--arabic);font-weight:700}
.bsec h4{font-size:13px;margin:10px 0 4px;color:var(--ink2);font-weight:600}
.bsec p{margin:0;max-width:68ch}
.bsec ul{margin:0;padding-inline-start:0;list-style:none;display:grid;gap:5px}
.bsec li{position:relative;padding-inline-start:18px}
.bsec li::before{content:"";position:absolute;inset-inline-start:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--accent)}
ul.risk li::before{background:var(--caution);border-radius:1px;transform:rotate(45deg)}
ul.small{font-size:13.5px;color:var(--ink2)}
.how{background:var(--ground);border-radius:8px;padding:12px 14px}
.minihead{display:none}

.recovery{margin-top:6px}
.timeline{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:0;position:relative}
.timeline li{position:relative;padding:22px 12px 4px 0;display:flex;flex-direction:column;gap:3px}
[dir="rtl"] .timeline li{padding:22px 0 4px 12px}
.timeline li::before{content:"";position:absolute;top:7px;inset-inline:0;height:2px;background:var(--accent);opacity:.35}
.tdot{position:absolute;top:2px;inset-inline-start:0;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2.5px solid var(--accent)}
.timeline li:last-child .tdot{background:var(--accent)}
.twhen{font-weight:600;color:var(--accent);font-size:14px;font-variant-numeric:tabular-nums}
.twhat{font-size:13.5px;line-height:1.45}
.note{font-size:12.5px;color:var(--ink2);margin-top:6px !important}
.backto{margin:0;display:grid;gap:8px}
.backto div{display:grid;grid-template-columns:78px 1fr;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.backto dt{font-weight:600;color:var(--accent)}
.backto dd{margin:0;font-size:14px}
.flags{background:var(--flag-soft);border:1px solid color-mix(in srgb,var(--flag) 35%,transparent);border-radius:8px;padding:12px 14px}
.flags h3{color:var(--flag)}
ul.flag li::before{background:var(--flag);border-radius:2px}
.disclaimer{font-size:12.5px;color:var(--ink2);border-top:1px solid var(--line);padding-top:10px;margin:14px 0 8px}
.stamp{display:grid;grid-template-columns:auto 1fr auto 1fr auto 1fr;gap:6px;align-items:end;font-size:12.5px;color:var(--ink2)}
.stamp i{border-bottom:1px solid var(--line);height:1.2em}

.ic{width:20px;height:20px;flex:none;display:inline-block}
.glance div{display:flex;gap:10px;align-items:flex-start}
.glance .ic{color:var(--accent);margin-top:3px;width:22px;height:22px}
.illus{margin:0 0 18px;display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr);gap:10px;align-items:start}
.ipanel{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.ipanel svg{display:block;width:100%;max-width:250px;height:auto;border-radius:10px;border:1.5px solid var(--line)}
.ipanel.bad svg{border-color:color-mix(in srgb,var(--flag) 45%,var(--line))}
.ipanel.good svg{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.ipanel figcaption{font-size:13.5px;line-height:1.4;max-width:250px}
.ipanel figcaption b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:1px}
[lang="ar"] .ipanel figcaption b{text-transform:none;letter-spacing:0;font-size:13px}
.ipanel.bad b{color:var(--flag)} .ipanel.good b{color:var(--accent)}
.iarrow{align-self:center;color:var(--accent);margin-top:-30px}
.iarrow svg{width:28px;height:28px;display:block}
[dir="rtl"] .iarrow svg{transform:scaleX(-1)}
.inote{grid-column:1/-1;font-size:11.5px;color:var(--ink2);margin:0;text-align:center}
.bsec ul.ico li{padding-inline-start:38px;min-height:28px;display:flex;align-items:center}
.bsec ul.ico li::before{display:none}
ul.ico .ic{position:absolute;inset-inline-start:0;top:50%;margin-top:-14px;width:28px;height:28px;padding:4px;border-radius:50%;background:var(--accent-soft);color:var(--accent)}
ul.ico.flag .ic{background:var(--paper);color:var(--flag)}
.twhen{display:flex;align-items:center;gap:5px}
.twhen .ic{width:18px;height:18px}
.backto div{grid-template-columns:104px 1fr}
.backto dt{display:flex;align-items:center;gap:6px}
.backto .ic{width:18px;height:18px}
.bsec h3 .ic.h{width:19px;height:19px;vertical-align:-3px;margin-inline-end:6px}

.form{container-type:inline-size}
.form .blk{margin-bottom:16px}
@container (max-width:600px){.formtop{grid-template-columns:1fr!important}.sigs{grid-template-columns:1fr 1fr!important}ul.rlist li{grid-template-columns:74px 1fr}}
.formtop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,330px);gap:16px;align-items:start}
.dept{font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
[lang="ar"] .dept{text-transform:none;letter-spacing:0;font-size:13px}
.doctype{font-family:var(--serif);font-weight:600;font-size:19px;color:var(--accent);margin-top:2px}
[lang="ar"] .doctype,[lang="ar"] .ftitle,[lang="ar"] .numh,[lang="ar"] .doch{font-family:var(--arabic);font-weight:700}
.label{border:1.5px solid var(--ink2);border-radius:6px;padding:8px 10px;display:grid;gap:7px;font-size:12.5px}
.label div{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:end}
.label span{color:var(--ink2)}
.label i{border-bottom:1px dotted var(--ink2);height:1.1em}
.label .sides{display:flex;gap:6px;align-items:center}
.ftitle{font-family:var(--serif);font-size:25px;line-height:1.25;margin:12px 0 2px;text-wrap:balance;border-top:2px solid var(--accent);padding-top:10px}
.fsub{color:var(--ink2)}
.intro{background:var(--accent-soft);border-radius:8px;padding:12px 14px}
.intro p{margin:0}.dear{font-weight:600;margin-bottom:4px!important}
.numh{display:flex;gap:10px;align-items:center;font-family:var(--serif);font-size:17px;margin:0 0 6px;font-weight:600}
.num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--paper);font-family:var(--sans);font-size:14px;font-weight:600;flex:none}
.blk p{margin:0 0 6px;max-width:75ch}
ul.dash{list-style:none;margin:0 0 6px;padding:0;display:grid;gap:4px}
ul.dash li{position:relative;padding-inline-start:18px}
ul.dash li::before{content:"–";position:absolute;inset-inline-start:2px;color:var(--accent);font-weight:700}
.fine{font-size:13px;color:var(--ink2)}
.legend{font-size:12.5px;background:var(--ground);border-radius:6px;padding:6px 10px}
.blk h4{font-size:14px;margin:10px 0 6px}
ul.rlist{list-style:none;margin:0 0 6px;padding:0;display:grid;gap:5px}
ul.rlist li{display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:baseline}
.fq{font-size:11.5px;font-weight:600;border-radius:99px;padding:1px 6px;text-align:center}
.fq-c{background:#FBE1D3;color:#8A3B12}.fq-u{background:#FFF0C7;color:#6E5100}.fq-r{background:#DDEEEA;color:#1F5E58}
.glance.small{margin:10px 0 0}
.sub .bsec{margin-bottom:10px}.sub .bsec h3{font-size:15.5px}
.docpart{border-top:3px double var(--ink2);margin-top:22px;padding-top:16px}
.doch{font-family:var(--serif);font-size:16.5px;margin:0 0 8px;display:flex;gap:6px;align-items:center;font-weight:600}
.qtab{width:100%;border-collapse:collapse;font-size:13.5px}
.qtab th{font-size:12px;color:var(--ink2);width:46px;text-align:center;font-weight:600}
.qtab td{border-top:1px solid var(--line);padding:5px 4px;vertical-align:top}
.qtab td+td{text-align:center}
.qn{color:var(--ink2);font-variant-numeric:tabular-nums}
.wh{font-size:13.5px;margin-top:8px!important}
.cb{display:inline-block;width:13px;height:13px;border:1.5px solid var(--ink);border-radius:2px;vertical-align:-2px;margin-inline-end:5px;background:var(--paper);flex:none}
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:5px 16px;font-size:13.5px;margin-bottom:8px}
.lines{display:grid;gap:14px;margin:6px 0 10px}.lines i{border-bottom:1px solid var(--line);height:14px;display:block}
.interp{font-size:13px}
.decide{border:1.5px dashed var(--line);border-radius:8px;padding:12px 14px}
.decide.con{border:2px solid var(--accent)}
.decide p{max-width:none}
.sigs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 16px;margin-top:16px}
.sigs.grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.sig i{display:block;border-bottom:1px solid var(--ink);height:30px}
.sig span{font-size:11.5px;color:var(--ink2)}
.copy{font-size:13.5px}
@media screen and (max-width:820px){.formtop{grid-template-columns:1fr}.sigs{grid-template-columns:1fr}ul.rlist li{grid-template-columns:74px 1fr}}
.srcblk,.bsec.sources{border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.srctop{margin:0 0 3px;color:var(--ink2)}
.srcblk .srch,.sources .srch{display:inline;font-size:.86em;margin:0;color:var(--ink2);font-weight:600}
.srcnote{font-size:.8em;color:var(--ink2)}
.srcnote::before{content:"— "}
ol.srclist{margin:0;padding:0 0 0 1.9em;font-family:var(--sans);font-size:.76em;line-height:1.36;color:var(--ink2);display:grid;gap:2px;text-align:left;list-style:decimal}
.bsec ol.srclist li{position:static;padding:0}
.bsec ol.srclist li::before{display:none}
ol.srclist a{color:inherit;text-decoration:none;white-space:nowrap}
ol.srclist a.url{white-space:normal;overflow-wrap:anywhere}
@media screen{ol.srclist a{color:var(--accent)} ol.srclist a:hover{text-decoration:underline}}

/* ── Patient QR panel (doctor view) ── */
.qrbtn{display:inline-flex;align-items:center;gap:6px}
.qrbtn svg{width:16px;height:16px}
.qrpanel{background:var(--paper);border:1.5px solid var(--accent);border-radius:10px;padding:18px 20px;margin-bottom:18px}
.qrpanel h2{font-family:var(--serif);font-weight:600;font-size:20px;margin:0 0 4px;text-wrap:balance}
.qrpanel .lead{color:var(--ink2);margin:0 0 14px;max-width:75ch;font-size:14px}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:16px}
.qrcard{margin:0;border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;justify-items:center;gap:8px;text-align:center}
.qrcard .qrbox{background:#fff;border-radius:8px;padding:6px;width:min(220px,100%)}
.qrcard .qrbox svg{display:block;width:100%;height:auto}
.qrcard b{font-size:15px}
.qrcard[lang="ar"]{font-family:var(--arabic)}
.qrcard .op{font-size:14px;color:var(--ink2);line-height:1.4}
.qrcard code{font-size:11.5px;word-break:break-all;color:var(--ink2);direction:ltr;unicode-bidi:isolate}
.qrrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.qrrow a,.qrrow button{font-size:13px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:transparent;color:var(--accent);text-decoration:none;cursor:pointer}
.qrset{margin-top:14px;font-size:13.5px}
.qrset summary{cursor:pointer;color:var(--accent);font-weight:600}
.qrset label{display:block;margin:10px 0 4px;color:var(--ink2)}
.qrset input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--paper);direction:ltr}
.qrset .qrrow{justify-content:flex-start;margin-top:8px}
.qrset p{color:var(--ink2);margin:8px 0 0;max-width:75ch}
.qrnote{font-size:12.5px;color:var(--ink2);margin-top:6px}
.qrwarn{background:var(--caution-soft);color:var(--caution);border-radius:8px;padding:8px 12px;font-size:13.5px;margin:0 0 12px}

/* ── Patient mode (opened from the QR link) ── */
body.pmode .topbar,body.pmode .layout{display:none}
#patient{max-width:780px;margin:0 auto;padding-block:0 28px;padding-inline:16px}
.phead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.phead .plabel{font-weight:600;color:var(--accent);font-size:14px}
.phead .plabel span{font-family:var(--arabic)}
.phead .seg button{font-size:15px;padding:7px 14px}
.pnote{background:var(--accent-soft);border-radius:10px;padding:12px 14px;margin:16px 0;font-size:15.5px;line-height:1.6}
.pnote[lang="ar"]{font-family:var(--arabic)}
#patient .brochure{font-size:16.5px}
#patient .brochure[lang="ar"]{font-size:17px}
#patient .ipanel svg{max-width:100%}
.pfoot2{font-size:13px;color:var(--ink2);text-align:center;margin-top:16px;line-height:1.6}
.pback{font-size:13px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:transparent;color:var(--accent);cursor:pointer}
.pmissing{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:16px}
.pmissing ul{columns:2;column-gap:24px;padding-inline-start:18px}
.pmissing a{color:var(--accent)}
@media screen and (max-width:560px){#patient .brochure{padding:18px 14px;font-size:16px}#patient .brochure[lang="ar"]{font-size:16.5px}.pmissing ul{columns:1}}

.coverage{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:24px 26px}
.coverage h2{font-family:var(--serif);font-weight:600;margin:0 0 6px;font-size:22px}
.coverage p{color:var(--ink2);max-width:72ch;margin:0 0 14px}
.covgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
.covgrid h3{font-size:14px;margin:0 0 6px}
.covgrid ul{margin:0;padding-inline-start:18px;font-size:14px}
.covgrid li{margin-bottom:4px}
.covgrid li em{color:var(--ink2);font-style:normal;font-size:13px}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600;margin-inline-start:6px}
.hint{font-size:12.5px;color:var(--ink2);margin:0 0 12px}

@media screen and (max-width:820px){
  .layout{grid-template-columns:1fr}
  .side{display:none}
  .mobilepick{display:block;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);margin-bottom:14px}
  .brochure{padding:20px 16px}
  .glance{grid-template-columns:1fr}
  .btitle{font-size:23px}
  .stamp{grid-template-columns:auto 1fr}
}
@media (prefers-reduced-motion:no-preference){.brochure{animation:rise .25s ease-out both}@keyframes rise{from{transform:translateY(4px)}to{transform:none}}}

body{margin:0}
#patient{display:block}
.plist h2{font-size:17px;margin:22px 0 8px;color:var(--accent)}
.plist ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}

      [/lift|carry|grip|pinch|twist|push yourself|lean/, "noweight"], [/sugar|diabet/, "sugar"],
      [/imaging|x-ray|follow-up|appointment/, "calendar"], [/patient|months to improve/, "clock"],
      [/physio|exercise|move|stretch|therapy|bend/, "exercise"], [/doctor|dentist|tell|kneel|chair|toilet|precaution|limits|expect/, "info"]
    ],
    flag: [
      [/fever|38/, "fever"], [/calf|breath|chest/, "clot"], [/wound|pus|edges/, "wound"],
      [/numb|pale|cold|blue|white|lift the foot/, "cold"], [/bleed|soak/, "bleed"], [/pain/, "pain"]

  return kind === "flag" ? "alert" : "check";
};

  }

  // Ligament roof (retinaculum / pulley) lying across a nerve or tendon, drawn as a square-ended strap. With `gap`, it is

// Patient links + QR codes (shared by the guides viewer, the QR handout cards and the SOAP Generator add-on).
// Links carry ONLY the operation id and language (e.g. #p-cuff-ar) — never patient data.
// QR encoding: qrcode-generator by Kazuhiko Arase (MIT), inlined as vendor_qrcode.min.js.
(function () {
  var DEFAULT_BASE = "https://alabdusalamn.github.io/ortho-patient-guides/";  // public patient page (GitHub Pages)

  function base(custom) {
    var b = custom;
    if (!b) { try { b = localStorage.getItem("osg-link-base") || ""; } catch (e) { b = ""; } }
    b = String(b || DEFAULT_BASE).trim().replace(/#.*$/, "");
    return b || DEFAULT_BASE;
  }

  window.PG_LINK = {
    DEFAULT_BASE: DEFAULT_BASE,
    base: base,
    isClaude: function () { return /claude\.ai\//i.test(base()); },
    setBase: function (b) { try { if (b && b.trim() && b.trim() !== DEFAULT_BASE) localStorage.setItem("osg-link-base", b.trim()); else localStorage.removeItem("osg-link-base"); } catch (e) {} },
    // hash token uses only letters, digits and "-" so it survives every host (artifact links pass bare #anchors only)
    token: function (id, lang) { return "p-" + id + "-" + (lang === "en" ? "en" : "ar"); },
    url: function (id, lang, customBase) { return base(customBase) + "#" + this.token(id, lang); },
    parse: function (hash) {
      var m = /^#?p-([a-z]+)(?:-(ar|en))?$/.exec(hash || "");
      return m ? { id: m[1], lang: m[2] || "ar" } : null;
    }
  };

  // QR as a crisp, scalable SVG string. quiet = quiet-zone modules (spec minimum 4).
  window.PG_QR = {
    svg: function (text, opts) {
      opts = opts || {};
      var q = qrcode(0, opts.ecc || "M");
      q.addData(text); q.make();
      var n = q.getModuleCount(), quiet = opts.quiet == null ? 4 : opts.quiet, size = n + quiet * 2, d = "";
      for (var r = 0; r < n; r++) {
        for (var c = 0; c < n; c++) {
          if (!q.isDark(r, c)) continue;
          var run = 1; while (c + run < n && q.isDark(r, c + run)) run++;
          d += "M" + (c + quiet) + " " + (r + quiet) + "h" + run + "v1h-" + run + "z";
          c += run - 1;
        }
      }
      var label = opts.label ? ' aria-label="' + String(opts.label).replace(/"/g, "&quot;") + '"' : ' aria-hidden="true"';
      return '<svg class="qr" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + size + " " + size + '" shape-rendering="crispEdges" role="img"' + label + '>' +
        '<rect width="' + size + '" height="' + size + '" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
    }
  };
})();

<script>
(function(){
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
  var TXT = {
    note: { en: "Your surgeon shared this page with you. Please read it before your operation and write down any questions you want to ask.",
            ar: "شارك جرّاحك هذه الصفحة معك. نرجو قراءتها قبل العملية، وتدوين أي أسئلة تودّ طرحها عليه." },
    foot: { en: "Department of Orthopaedic Surgery · This page does not collect or store any personal information.",
            ar: "قسم جراحة العظام · هذه الصفحة لا تجمع أي معلومات شخصية ولا تحفظها." },
    title:{ en: "Patient guides for orthopaedic operations", ar: "أدلة المرضى لعمليات العظام" },
    intro:{ en: "Choose your operation to read what you need to know before and after it.", ar: "اختر عمليتك لتقرأ ما تحتاج معرفته قبل العملية وبعدها." },
    all:  { en: "All guides", ar: "كل الأدلة" },
    missing:{ en: "We could not find this guide. Choose your operation from the list.", ar: "لم نجد هذا الدليل. اختر عمليتك من القائمة." }
  };
  var order = ["knee","hip","shoulder","foot","hand"];
  function findB(id){ return BROCHURES.filter(function(x){return x.id===id;})[0]; }
  function head(L, target){
    return '<header class="phead"><span class="plabel">Patient guide · <span>دليل المريض</span></span>' +
      '<div class="seg" role="group" aria-label="Language / اللغة">' +
      '<a class="ar" href="#'+target("ar")+'"'+(L==="ar"?' aria-current="true"':'')+'>العربية</a>' +
      '<a href="#'+target("en")+'"'+(L==="en"?' aria-current="true"':'')+'>English</a></div></header>';
  }
  function list(L, msg){
    var dir = L==="ar"?"rtl":"ltr";
    document.title = TXT.title[L];
    document.getElementById("patient").innerHTML = head(L, function(l){ return l; }) +
      '<section class="plist" dir="'+dir+'" lang="'+L+'"><p class="pnote" dir="'+dir+'" lang="'+L+'">'+esc(msg || TXT.intro[L])+'</p>' +
      order.map(function(g){
        var items = BROCHURES.filter(function(b){ return b.group===g; });
        return '<h2>'+esc(COMMON.groups[g][L])+'</h2><ul>' + items.map(function(b){
          return '<li><a href="#'+PG_LINK.token(b.id,L)+'">'+esc(b[L].op)+'<small>'+esc(b[L].name)+'</small></a></li>'; }).join("") + '</ul>';
      }).join("") + '</section><p class="pfoot2" dir="'+dir+'" lang="'+L+'">'+esc(TXT.foot[L])+'</p>';
  }
  function guide(p){
    var b = findB(p.id), L = p.lang, dir = L==="ar"?"rtl":"ltr";
    if (!b) { list(L, TXT.missing[L]); return; }
    document.title = b[L].op + " — " + (L==="ar" ? "دليل المريض" : "Patient guide");
    document.getElementById("patient").innerHTML = head(L, function(l){ return PG_LINK.token(b.id,l); }) +
      '<p class="pnote" dir="'+dir+'" lang="'+L+'">'+esc(TXT.note[L])+'</p>' +
      renderBrochure(b, L) +
      '<p class="pfoot2" dir="'+dir+'" lang="'+L+'">'+esc(TXT.foot[L])+' · <a class="phome" href="#'+L+'">'+esc(TXT.all[L])+'</a></p>';
  }
  function route(){
    var h = location.hash.replace(/^#/, ""), p = PG_LINK.parse(h);
    document.documentElement.lang = p ? p.lang : (h==="en" ? "en" : "ar");
    if (p) guide(p); else list(h==="en" ? "en" : "ar");
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
